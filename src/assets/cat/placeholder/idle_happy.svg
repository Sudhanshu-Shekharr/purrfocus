<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <!-- Soft drop shadow -->
  <ellipse cx="160" cy="275" rx="75" ry="14" fill="#000" opacity="0.08" />
  <!-- Tail -->
  <path d="M210 240 C250 240 265 200 250 175 C240 160 225 175 230 190 C235 205 210 225 190 235" stroke="#4A3E3D" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <path d="M105 260 C100 200 120 130 160 130 C200 130 220 200 215 260 C215 275 105 275 105 260 Z" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="6" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="160" cy="120" r="58" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="6"/>
  <!-- Left Ear -->
  <path d="M115 90 L95 40 L140 70 Z" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="6" stroke-linejoin="round"/>
  <path d="M115 80 L104 50 L132 68 Z" fill="#FFC0BE" />
  <!-- Right Ear -->
  <path d="M205 90 L225 40 L180 70 Z" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="6" stroke-linejoin="round"/>
  <path d="M205 80 L216 50 L188 68 Z" fill="#FFC0BE" />
  <!-- Eyes (Happy Crescents) -->
  <path d="M135 115 Q145 105 155 115" stroke="#4A3E3D" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M165 115 Q175 105 185 115" stroke="#4A3E3D" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Nose and Mouth -->
  <polygon points="160,123 156,128 164,128" fill="#FF9A9E" />
  <path d="M156 128 Q150 135 145 131" stroke="#4A3E3D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M164 128 Q170 135 175 131" stroke="#4A3E3D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Blush -->
  <circle cx="130" cy="128" r="8" fill="#FFB5B5" opacity="0.6"/>
  <circle cx="190" cy="128" r="8" fill="#FFB5B5" opacity="0.6"/>
  <!-- Paws tucked -->
  <ellipse cx="140" cy="255" rx="14" ry="9" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="5"/>
  <ellipse cx="180" cy="255" rx="14" ry="9" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="5"/>
</svg>
