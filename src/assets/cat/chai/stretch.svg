<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
<!-- Drop shadow -->
    <ellipse cx="160" cy="275" rx="90" ry="14" fill="#000" opacity="0.08" />
    <!-- Tail pointing high in air -->
    <path d="M230 190 C260 160 270 110 250 85 C240 75 225 90 232 105 C240 120 220 155 205 180" stroke="#4A3E3D" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Arched Stretched Body -->
    <path d="M90 255 C120 255 130 180 200 185 C220 185 230 215 220 255 C200 270 100 270 90 255 Z" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="6" stroke-linejoin="round"/>
    <!-- Calico body patches -->
    <ellipse cx="155" cy="225" rx="26" ry="22" fill="#E29578" />
    <ellipse cx="190" cy="210" rx="18" ry="16" fill="#4A3E3D" />
    <!-- Front paws reaching forward -->
    <ellipse cx="85" cy="265" rx="16" ry="9" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="4.5"/>
    <ellipse cx="115" cy="265" rx="16" ry="9" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="4.5"/>
    <!-- Head low in big stretch -->
    <circle cx="125" cy="200" r="46" fill="#FFF5EA" stroke="#4A3E3D" stroke-width="6"/>
    <!-- Calico head patch -->
    <ellipse cx="138" cy="182" rx="15" ry="13" fill="#E29578" />
    <!-- Ears back -->
    <path d="M125 155 L115 115 L148 140 Z" fill="#4A3E3D" stroke="#4A3E3D" stroke-width="5" stroke-linejoin="round"/>
    <path d="M165 165 L185 130 L175 160 Z" fill="#E29578" stroke="#4A3E3D" stroke-width="5" stroke-linejoin="round"/>
    <!-- Happy sleepy squint -->
    <path d="M105 195 Q115 188 125 195" stroke="#4A3E3D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Yawning mouth -->
    <ellipse cx="120" cy="214" rx="8" ry="10" fill="#FF8A8A" stroke="#4A3E3D" stroke-width="3"/>
</svg>
