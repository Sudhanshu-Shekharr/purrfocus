<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Purrfocus · a cozy, aesthetic Pomodoro study space with an animated cat companion, ambient sounds, and scenic views."
    />
    <meta name="theme-color" content="#f6d9cf" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts Preconnect & Async Font Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..600;1,9..40,300..600&family=Playfair+Display:ital,wght@0,400..600;1,400..600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..600;1,9..40,300..600&family=Playfair+Display:ital,wght@0,400..600;1,400..600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..600;1,9..40,300..600&family=Playfair+Display:ital,wght@0,400..600;1,400..600&display=swap"
      />
    </noscript>

    <title>Purrfocus</title>

    <!-- Immediate theme attribute sync to prevent flash of wrong scene -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('purrfocus:scenery');
          if (raw) {
            var data = JSON.parse(raw);
            var id = data && data.state && data.state.activeSceneId;
            var tokenMap = {
              scene1: 'rain',
              scene2: 'midnight',
              scene3: 'nocturne',
              scene4: 'peach',
              scene5: 'garden'
            };
            if (id && tokenMap[id]) {
              document.documentElement.setAttribute('data-scene', tokenMap[id]);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
